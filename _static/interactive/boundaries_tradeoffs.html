<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade-Offs - Interactive Triangle</title>
    <style>
        /* Reset and base styles */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--cothrom-panel);
            color: var(--cothrom-ink);
            line-height: 1.6;
        }

        /* Main container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* For embedded components - no extra padding */
        .embedded {
            padding: 10px;
        }

        /* Typography */
        h1 {
            font-size: 32px;
            font-weight: 600;
            margin: 0 0 20px 0;
            color: var(--cothrom-ink);
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 40px 0 20px 0;
            color: var(--cothrom-ink);
            padding-bottom: 10px;
            border-bottom: 2px solid var(--cothrom-surface);
        }

        h3 {
            font-size: 18px;
            font-weight: 600;
            margin: 25px 0 15px 0;
            color: var(--cothrom-ink);
        }

        h4 {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 15px 0;
        }

        /* Micro labels */
        .micro-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--cothrom-muted);
            margin-bottom: 8px;
        }

        /* Intro box */
        .intro-box {
            background: var(--cothrom-surface);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .intro-box p {
            margin: 0;
            font-size: 15px;
        }

        /* Section containers */
        .section {
            margin-bottom: 40px;
        }

        /* Comparison container - flex layout for side-by-side */
        .comparison-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .comparison-container {
                flex-direction: column;
            }
        }

        /* Example cards */
        .example-card {
            flex: 1;
            background: var(--cothrom-panel);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .example-card.good {
            border-left: 3px solid var(--cothrom-green);
        }

        .example-card.good h4 {
            color: var(--cothrom-green);
        }

        .example-card.bad {
            border-left: 3px solid var(--cothrom-accent-dark);
        }

        .example-card.bad h4 {
            color: var(--cothrom-accent-dark);
        }

        .example-card.moderate {
            border-left: 3px solid var(--cothrom-accent);
        }

        .example-card.moderate h4 {
            color: var(--cothrom-accent);
        }

        /* Interactive sections */
        .interactive-section {
            background: var(--cothrom-surface);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        /* Info boxes (important callouts) */
        .info-box {
            background: linear-gradient(135deg, color-mix(in srgb, var(--cothrom-green) 6%, transparent) 0%, color-mix(in srgb, var(--cothrom-green-bright) 6%, transparent) 100%);
            border-left: 3px solid var(--cothrom-green);
            border-radius: 0 8px 8px 0;
            padding: 15px;
            margin: 20px 0;
        }

        .info-box h4 {
            color: var(--cothrom-green);
            margin-bottom: 8px;
        }

        .info-box p {
            margin: 0;
        }

        /* Warning boxes */
        .warning-box {
            background: linear-gradient(135deg, color-mix(in srgb, var(--cothrom-accent) 6%, transparent) 0%, color-mix(in srgb, var(--cothrom-accent-dark) 6%, transparent) 100%);
            border-left: 3px solid var(--cothrom-accent);
            border-radius: 0 8px 8px 0;
            padding: 15px;
            margin: 20px 0;
        }

        .warning-box h4 {
            color: var(--cothrom-accent);
            margin-bottom: 8px;
        }

        .warning-box p {
            margin: 0;
        }

        /* Buttons */
        .btn {
            background: var(--cothrom-green-bright);
            color: var(--cothrom-panel);
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: var(--cothrom-green);
        }

        .btn:disabled {
            background: var(--cothrom-border);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--cothrom-accent);
        }

        .btn-secondary:hover {
            background: var(--cothrom-accent-dark);
        }

        /* Range sliders */
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
            -webkit-appearance: none;
            height: 8px;
            background: var(--cothrom-border);
            border-radius: 4px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--cothrom-green-bright);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--cothrom-green-bright);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        /* Visual bars */
        .bar-container {
            background: var(--cothrom-border);
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
            margin: 5px 0;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 4px;
        }

        .bar-fill.good {
            background: var(--cothrom-green-bright);
        }

        .bar-fill.moderate {
            background: var(--cothrom-accent);
        }

        .bar-fill.bad {
            background: var(--cothrom-accent-dark);
        }

        /* Status indicators */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .status.good {
            background: color-mix(in srgb, var(--cothrom-green) 13%, transparent);
            color: var(--cothrom-green);
        }

        .status.moderate {
            background: color-mix(in srgb, var(--cothrom-accent) 13%, transparent);
            color: var(--cothrom-accent);
        }

        .status.bad {
            background: color-mix(in srgb, var(--cothrom-accent-dark) 13%, transparent);
            color: var(--cothrom-accent-dark);
        }

        /* Data display */
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .data-item {
            background: var(--cothrom-surface);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .data-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--cothrom-green);
            margin: 0;
        }

        .data-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--cothrom-muted);
            margin-top: 4px;
        }

        /* Metric row */
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--cothrom-border);
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: var(--cothrom-muted);
            font-size: 13px;
        }

        .metric-value {
            font-weight: 600;
            font-size: 13px;
        }

        /* Visualization containers */
        .viz-container {
            background: var(--cothrom-panel);
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* SVG visualizations */
        .svg-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Utility classes */
        .text-center {
            text-align: center;
        }

        .text-good {
            color: var(--cothrom-green);
        }

        .text-bad {
            color: var(--cothrom-accent-dark);
        }

        .text-moderate {
            color: var(--cothrom-accent);
        }

        .mt-20 {
            margin-top: 20px;
        }

        .mb-20 {
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container, .embedded {
                padding: 10px;
            }

            h1 {
                font-size: 26px;
            }

            h2 {
                font-size: 20px;
            }

            .data-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Animation classes */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeIn 0.3s ease forwards;
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--cothrom-border);
            margin-top: 60px;
            padding-top: 20px;
            font-size: 12px;
            color: var(--cothrom-muted);
        }

        footer p {
            margin: 5px 0;
            font-size: 12px;
        }
    </style>
  <link rel="stylesheet" href="../cothrom.css">
</head>
<body>
    <div class="embedded">
        
        <h4>The Impossible Triangle</h4>
        <p>Adjust the sliders to see how prioritizing one objective affects the others.</p>

        <div class="viz-container">
            <div style="max-width: 500px; margin: 0 auto;">
                <!-- Priority sliders -->
                <div style="margin-bottom: 25px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label style="font-size: 13px; font-weight: 600; color: var(--cothrom-green);">Population Balance</label>
                        <span id="balance-value" style="font-size: 13px; font-weight: 600;">50%</span>
                    </div>
                    <input type="range" id="balance-slider" min="0" max="100" value="50">
                </div>

                <div style="margin-bottom: 25px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label style="font-size: 13px; font-weight: 600; color: var(--cothrom-accent);">County Integrity</label>
                        <span id="county-value" style="font-size: 13px; font-weight: 600;">50%</span>
                    </div>
                    <input type="range" id="county-slider" min="0" max="100" value="50">
                </div>

                <div style="margin-bottom: 25px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label style="font-size: 13px; font-weight: 600; color: var(--cothrom-accent-dark);">Compactness</label>
                        <span id="compact-value" style="font-size: 13px; font-weight: 600;">50%</span>
                    </div>
                    <input type="range" id="compact-slider" min="0" max="100" value="50">
                </div>

                <!-- Result display -->
                <div id="tradeoff-result" style="
                    background: var(--cothrom-surface);
                    padding: 20px;
                    border-radius: 8px;
                    margin-top: 20px;
                ">
                    <h4 style="margin: 0 0 15px 0; font-size: 14px;">Resulting Map Characteristics:</h4>
                    <div class="metric-row">
                        <span class="metric-label">Expected Variance</span>
                        <span class="metric-value" id="result-variance">&plusmn;4%</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">County Breaks</span>
                        <span class="metric-value" id="result-breaks">3-4 counties</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Shape Quality</span>
                        <span class="metric-value" id="result-shape">Moderate</span>
                    </div>
                    <p id="result-description" style="font-size: 12px; margin-top: 15px; color: var(--cothrom-muted);">
                        A balanced approach that accepts some compromises in each area.
                    </p>
                </div>

                <button class="btn" onclick="resetTradeoffs()" style="width: 100%; margin-top: 15px;">
                    Reset to Balanced
                </button>
            </div>
        </div>
    
    </div>
    
    <script>
    const balanceSlider = document.getElementById('balance-slider');
    const countySlider = document.getElementById('county-slider');
    const compactSlider = document.getElementById('compact-slider');

    function updateTradeoffs() {
        const balance = parseInt(balanceSlider?.value || 50);
        const county = parseInt(countySlider?.value || 50);
        const compact = parseInt(compactSlider?.value || 50);

        document.getElementById('balance-value').textContent = balance + '%';
        document.getElementById('county-value').textContent = county + '%';
        document.getElementById('compact-value').textContent = compact + '%';

        const varianceResult = balance >= 80 ? '&plusmn;2%' :
                              balance >= 60 ? '&plusmn;3-4%' :
                              balance >= 40 ? '&plusmn;4-5%' :
                              balance >= 20 ? '&plusmn;5-7%' : '&plusmn;7-10%';

        const breaksResult = county >= 80 ? '0-1 counties' :
                            county >= 60 ? '2-3 counties' :
                            county >= 40 ? '3-4 counties' :
                            county >= 20 ? '5-7 counties' : '8+ counties';

        const shapeResult = compact >= 80 ? 'Excellent' :
                          compact >= 60 ? 'Good' :
                          compact >= 40 ? 'Moderate' :
                          compact >= 20 ? 'Poor' : 'Very Poor';

        document.getElementById('result-variance').innerHTML = varianceResult;
        document.getElementById('result-breaks').textContent = breaksResult;
        document.getElementById('result-shape').textContent = shapeResult;

        let desc = '';
        if (balance >= 70 && county < 40 && compact < 40) {
            desc = 'Prioritizes equal representation above all. Expect broken counties and unusual shapes.';
        } else if (county >= 70 && balance < 40) {
            desc = 'Prioritizes keeping counties intact. Some constituencies will be over/under represented.';
        } else if (compact >= 70 && balance < 40) {
            desc = 'Prioritizes regular shapes. May sacrifice both equality and county integrity.';
        } else {
            desc = 'A balanced approach that accepts some compromises in each area.';
        }
        document.getElementById('result-description').textContent = desc;
    }

    if (balanceSlider) balanceSlider.addEventListener('input', updateTradeoffs);
    if (countySlider) countySlider.addEventListener('input', updateTradeoffs);
    if (compactSlider) compactSlider.addEventListener('input', updateTradeoffs);

    function resetTradeoffs() {
        if (balanceSlider) balanceSlider.value = 50;
        if (countySlider) countySlider.value = 50;
        if (compactSlider) compactSlider.value = 50;
        updateTradeoffs();
    }

    document.addEventListener('DOMContentLoaded', updateTradeoffs);
    </script>
    
</body>
</html>
